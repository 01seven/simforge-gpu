[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simforge-gpu"
version = "0.1.0"
description = "Torch-first external-agent harness for CPU-to-GPU simulation migration."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "SimForge GPU contributors" },
]
keywords = ["torch", "cupy", "gpu", "simulation", "validation", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
gpu = [
  "cupy-cuda12x",
  "nvidia-cuda-nvrtc-cu12; platform_system == 'Windows'",
  "nvidia-cuda-runtime-cu12; platform_system == 'Windows'",
  "nvidia-curand-cu12; platform_system == 'Windows'",
]

[project.scripts]
simforge = "simforge_gpu.cli:main"

[tool.setuptools.packages.find]
include = ["simforge_gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: tests that require a CUDA-compatible GPU and optional GPU dependencies",
]
